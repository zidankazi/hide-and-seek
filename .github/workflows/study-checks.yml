name: Study checks

on: [push, pull_request]

permissions:
  contents: read

jobs:
  supported-workflow:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.11.8"
          python-version: "3.13"
      - run: uv sync --locked --extra dev --extra notebook
      - run: uv run ruff check evaluate.py demo.py build_notebook.py tests
      - run: uv run ruff format --check evaluate.py demo.py build_notebook.py tests
      - run: uv run python -m pytest tests -q
      - run: uv run python evaluate.py --episodes 2 --output /tmp/study-smoke.json
      - run: uv run python demo.py --preset tight-room --seed 10 --output /tmp/study-demo.gif
      - run: uv run python build_notebook.py
      - run: git diff --exit-code -- walkthrough.ipynb
      - name: Execute notebook cells
        run: |
          uv run python - <<'PY'
          import nbformat
          from nbclient import NotebookClient
          notebook = nbformat.read("walkthrough.ipynb", as_version=4)
          NotebookClient(notebook, timeout=120, kernel_name="python3").execute()
          PY
